<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#05060c" />
<title>NEON//CALC — Cyber Funk Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="scanlines"></div>
  <div class="grid-floor"></div>
  <div class="vignette"></div>

  <main class="rig">
    <header class="rig__top">
      <div class="brand">
        <span class="brand__mark">◆</span>
        <h1 class="brand__title glitch" data-text="NEON//CALC">NEON//CALC</h1>
      </div>
      <div class="status">
        <span class="status__dot"></span>
        <span class="status__text" id="clock">--:--:--</span>
      </div>
    </header>

    <section class="panel">
      <div class="panel__label">
        <span>OUTPUT_TERMINAL</span>
        <span class="panel__tag" id="modeTag">STD_MODE</span>
      </div>

      <div class="display">
        <div class="display__history" id="history">&nbsp;</div>
        <div class="display__value" id="display">0</div>
      </div>

      <div class="keys">
        <button class="key key--fn" data-action="clear">ESC</button>
        <button class="key key--fn" data-action="sign">±</button>
        <button class="key key--fn" data-action="percent">%</button>
        <button class="key key--op" data-action="divide">÷</button>

        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key key--op" data-action="multiply">×</button>

        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key key--op" data-action="subtract">−</button>

        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key key--op" data-action="add">+</button>

        <button class="key key--wide" data-num="0">0</button>
        <button class="key" data-action="decimal">.</button>
        <button class="key key--eq" data-action="equals">=</button>
      </div>

      <div class="panel__foot">
        <span>BUILD v2.6.07</span>
        <span class="panel__hint">KEYBOARD ENABLED</span>
        <span>© 2077 NEON CORP</span>
      </div>
    </section>

    <footer class="rig__bottom">
      <button class="chip" id="soundToggle" aria-pressed="false">
        <span class="chip__led"></span> SFX <b id="soundLabel">OFF</b>
      </button>
      <button class="chip" id="themeToggle">
        <span class="chip__led chip__led--alt"></span> PALETTE <b id="themeLabel">NIGHT</b>
      </button>
      <div class="cpu"><span id="cpuLoad">CPU 12%</span><i style="--w: 62%"></i></div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
